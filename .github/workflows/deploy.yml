# Deploy to Cloudflare Workers static assets on every push to main (and on demand).
# Uses repository secrets CLOUDFLARE_API_TOKEN (Workers edit + Zone:DNS:Edit on
# uibubbles.org) and CLOUDFLARE_ACCOUNT_ID. Wrangler is a pinned root devDependency
# and runs through pnpm; cloudflare/wrangler-action cannot install into a pnpm
# workspace root (ERR_PNPM_ADDING_TO_ROOT).
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
